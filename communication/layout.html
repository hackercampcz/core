<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
      @font-face {
        font-family: "PT Mono";
        src:
          local("PT Mono"),
          url("https://www.hackercamp.cz/assets/css/PT-Mono_Regular.woff2") format("woff2"),
          url("https://www.hackercamp.cz/assets/css/PT-Mono_Regular.woff") format("woff"),
          url("https://www.hackercamp.cz/assets/css/PT-Mono_Regular.tff") format("tff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "PT Mono";
        src:
          local("PT Mono Bold"),
          url("https://www.hackercamp.cz/assets/css/PT-Mono_Bold.woff2") format("woff2"),
          url("https://www.hackercamp.cz/assets/css/PT-Mono_Bold.woff") format("woff"),
          url("https://www.hackercamp.cz/assets/css/PT-Mono_Bold.tff") format("tff");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      body {
        font-family: PT Mono, monospace;
      }

      p {
        font-family: PT Mono, monospace;
        max-width: 50em;
        text-wrap: pretty;
      }

      ul, ol {
        font-family: PT Mono, monospace;
        max-width: 45em;
        text-wrap: pretty;
      }

      code {
        font-family: inherit;
        font-size: 0.9em;
        background-color: #e3f1fb;
        border-radius: 4px;
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    {{{ @content }}}
  </body>
</html>
